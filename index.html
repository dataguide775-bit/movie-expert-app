<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Expert Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #0b0b0b;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
            object-fit: cover;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .search-bar {
            width: 90%;
            max-width: 350px;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--card-bg);
            color: white;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            outline: none;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .movie-poster {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .movie-title {
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .download-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .download-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
    function handleDownload(adLink, telegramLink) {
        // ඇඩ් ලින්ක් එක අලුත් ටැබ් එකක ඕපන් කරනවා
        window.open(adLink, '_blank');
        
        // තත්පර 1කට පස්සේ ටෙලිග්‍රෑම් බොට් එකට යූසර්ව අරන් යනවා
        setTimeout(() => {
            window.location.href = telegramLink;
        }, 1000);
    }

    function filterMovies() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('movie-card');

        for (let i = 0; i < cards.length; i++) {
            let titleElement = cards[i].querySelector('.movie-title');
            if (titleElement) {
                let titleText = titleElement.innerText.toLowerCase();
                if (titleText.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    }
    </script>
