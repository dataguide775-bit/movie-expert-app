<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Expert Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #0b0b0b;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
            object-fit: cover;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .search-bar {
            width: 90%;
            max-width: 350px;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--card-bg);
            color: white;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            outline: none;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .movie-poster {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
            text-align: center;
        }

        .movie-title {
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .download-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .download-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="photo_2026-03-01_18-59-36.jpg" alt="Logo" class="logo">
        <h1>Movie Expert Official</h1>
    </div>

    <input type="text" class="search-bar" placeholder="චිත්‍රපටයක් සොයන්න, සර්...">

    <div class="movie-grid">
        <div class="movie-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrcWfbFERV30vGQzkfSaN53EbAOXi-xKBy07UaIfGDPqPKE6D6XdskHmtTmNfhLCQPbgM-&s=10" class="movie-poster">
            <div class="movie-info">
                <span class="movie-title">Demonte Colony 2</span>
                <button class="download-btn" onclick="handleDownload('dimontecolony2', 'https://www.effectivegatecpm.com/gpga5p91p?key=904576eba2b7b7b7545a2087406f4152')">Download Now</button>
            </div>
        </div>

        <div class="movie-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_gA25hvAzvrTHQaotqRuOVJqQbWScm5Ig5dF4ctHmnF5bUjPpUFqKTHZRqrm8CwG-98ILbA&s=10" class="movie-poster">
            <div class="movie-info">
                <span class="movie-title">RRR 2022</span>
                <button class="download-btn" onclick="handleDownload('rrr2022', 'https://www.effectivegatecpm.com/gpga5p91p?key=904576eba2b7b7b7545a2087406f4152')">Download Now</button>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
    function handleDownload(movieId, adLink) {
        // 1. Ad එක අලුත් Tab එකක Open කරනවා
        window.open(adLink, '_blank');

        // 2. තත්පර 2කින් පසු Bot එකට රැගෙන ගොස් Movie එක ඉල්ලනවා
        // මෙතන '@movieexpertofficialbot' වෙනුවට සර්ගේ බොට්ගේ නම (@ නැතිව) දාන්න
        // උදා: movieexpertofficialbot
        setTimeout(() => {
            window.location.href = "https://t.me/movieexpertofficialbot?start=" + movieId;
        }, 2000);
    }
</script>
</body>
</html>
